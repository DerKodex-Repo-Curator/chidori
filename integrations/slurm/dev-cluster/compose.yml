services:
  mysql:
    image: mariadb:10
    hostname: mysql
    container_name: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: slurm_acct_db
      MYSQL_USER: slurm
      MYSQL_PASSWORD: password
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - slurm-network

  slurmdbd:
    image: slurm
    build:
      context: .
    command: ["slurmdbd"]
    container_name: slurmdbd
    hostname: slurmdbd
    volumes:
      - munge:/etc/munge
    expose:
      - "6819"
    depends_on:
      - mysql
    networks:
      - slurm-network

  slurmctld:
    image: slurm
    command: ["slurmctld"]
    container_name: slurmctld
    hostname: slurmctld
    volumes:
      - munge:/etc/munge
      - ./config:/etc/slurm
      - ./.data/jobs:/data
      - ../slurm-hooks:/hooks
      - ../spank-plugin:/spank
      - ~/juice:/opt/juice
    expose:
      - "6817"
    depends_on:
      - "slurmdbd"
    networks:
      - slurm-network

  compute1:
    image: slurm
    command: ["slurmd"]
    hostname: compute1
    container_name: compute1
    volumes:
      - munge:/etc/munge
      - ./config:/etc/slurm
      - ./.data/jobs:/data
      - ./.data/logs:/var/log/slurm
      - ../spank-plugin:/spank
      - ~/juice:/opt/juice
    expose:
      - "6818"
    depends_on:
      - "slurmctld"
    networks:
      - slurm-network

volumes:
  munge:
  mysql:
networks:
  slurm-network:
